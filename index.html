<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist</title>

    <!-- <link rel="icon" href=""> -->
    <link rel="stylesheet" href="./style.css">

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Jura&family=Kalam&family=Pacifico&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link  href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="./script.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <header>
    <button type="button" id="sharebtn" class="share-btn">Share</button>
    <span id="viewerNote" class="viewer-note hidden">Shared list</span>
    <div class="filter-wrap">
        <button type="button" id="filterBtn" class="filter-btn">Filters ▾</button>

        <div id="filterPanel" class="filter-panel hidden">

            <div class="filter-group">
                <label for="viewMode">Show</label>
                <select id="viewMode" class="select-box">
                    <option value="all" selected>All</option>
                    <option value="groupsOnly">Groups only</option>
                    <option value="individualOnly">Individual only</option>
                </select>
            </div>

            <div class="filter-group">
                <label>Price</label>
                <div class="range-row">
                    <input type="number" id="priceMin" class="range-input" placeholder="from" min="0">
                    <span class="range-sep">—</span>
                    <input type="number" id="priceMax" class="range-input" placeholder="to" min="0">
                </div>
            </div>

            <div class="filter-group">
                <label for="searchPriority">Sort</label>
                <select id="searchPriority" class="select-box">
                    <option value="a1" selected>Base</option>
                    <option value="high">A-Z (A-Я)</option>
                    <option value="medium">Z-A (Я-А)</option>
                    <option value="low">Lowest price first↓</option>
                    <option value="low2">Initially expensive↑</option>
                </select>
            </div>

        </div>
    </div>
</header>

    <div id="shareHint" class="share-hint hidden">
        <div class="share-hint-text">
            <p>Натисніть на блок або групу, щоб не ділитися ними. Натисніть повторно «Share», щоб скопіювати посилання.</p>
            <p>Tap a block or group to leave it out. Tap "Share" again to copy the link.</p>
        </div>
        <button type="button" id="shareCancel" class="share-cancel">&times;</button>
    </div>

    <main>

        <div class="list">
            <!-- <div class="block_r">
                <img id="photo" src="./media/notimg.svg"/>
                <div class="stovb"> 
                    <p>Опис Опис Опис Опис Опис Опис Опис Опис</p>
                    <p>0000¤</p>
                </div>
                <button id="delete"><img src="./media/trash_of.svg"/></button>
            </div>-->
        </div>

    </main>

    <footer>
        <div class="fo">
            <div class="col"> <p class="text_col"><span id="itemCount" class="item-count">0/0</span><span id="sumValue">0</span><span class="currency-symbol">¤</span></p> </div>
            <div class="ostrov"> <img id="open" src="./media/plus.svg"/></div>
        </div>
    </footer>

<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">

        <div class="modal-header">
            <h3 id="modalTitle">Create a record</h3>
            <button id="closeModalBtn" class="modal-close">&times;</button>
        </div>

        <form id="addForm" onsubmit="event.preventDefault();">

            <div class="form-group">
                <div id="dropZone" class="drop-zone">
                    <input type="file" id="fileInput" accept="image/*" class="hidden">

                    <div id="uploadPlaceholder" class="upload-placeholder">
                        <span>Add photo</span>
                    </div>

                    <img id="existingPhotoPreview" class="existing-photo hidden" src="" alt="Current photo">

                    <div id="cropperContainer" class="cropper-container hidden">
                        <div class="cropper-frame">
                            <img id="cropImage" src="" alt="Crop target">
                        </div>
                        <button type="button" id="resetCropBtn" class="undo-btn">Undo</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="form-label-row">
                    <label for="titleInput">Brief description</label>
                    <span id="charCounter">0 / 50</span>
                </div>
                <input type="text" id="titleInput" maxlength="50" placeholder="Text">
            </div>

            <div class="form-group">
                <label for="numberInput">Price</label>
                <input type="number" id="numberInput" placeholder="0">
            </div>

            <div class="form-group">
                <label for="linkInput">Link</label>
                <input type="url" id="linkInput" placeholder="https://">
            </div>

            <div class="form-group">
                <label for="groupInput">Group (optional)</label>
                <input type="text" id="groupInput" autocomplete="off" placeholder="Tap to type · hold to pick existing">
                <div id="groupPicker" class="group-picker hidden"></div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Add</button>

        </form>
    </div>
</div>

<div id="toast" class="toast"></div>

</body>
</html>
