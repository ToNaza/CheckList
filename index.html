<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">

        <div class="modal-header">
            <h3 id="modalTitle">Create a record</h3>
            <button id="closeModalBtn" class="modal-close">&times;</button>
        </div>

        <form id="addForm" onsubmit="event.preventDefault();">

            <div class="form-group">
                <div id="dropZone" class="drop-zone">
                    <input type="file" id="fileInput" accept="image/*" class="hidden">

                    <div id="uploadPlaceholder" class="upload-placeholder">
                        <span>Add photo</span>
                    </div>

                    <img id="existingPhotoPreview" class="existing-photo hidden" src="" alt="Current photo">

                    <div id="cropperContainer" class="cropper-container hidden">
                        <div class="cropper-frame">
                            <img id="cropImage" src="" alt="Crop target">
                        </div>
                        <button type="button" id="resetCropBtn" class="undo-btn">Undo</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="form-label-row">
                    <label for="titleInput">Brief description</label>
                    <span id="charCounter">0 / 50</span>
                </div>
                <input type="text" id="titleInput" maxlength="50" placeholder="Text">
            </div>

            <div class="form-group">
                <label for="numberInput">Price</label>
                <input type="number" id="numberInput" placeholder="0">
            </div>

            <div class="form-group">
                <label for="linkInput">Link</label>
                <input type="url" id="linkInput" placeholder="https://">
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">Add</button>

        </form>
    </div>
</div>
