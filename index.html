<body>
    <header>
        <div class="col"> <p class="text_col"><span id="sumValue">0</span><span class="currency-symbol">¤</span></p> </div>

            <form class="search-form" id="searchForm">
                <div class="row">
                    <select id="searchPriority" class="box select-box">
                        <option value="a1" disabled selected>Base</option>
                        <option value="high">A-Z (A-Я)</option>
                        <option value="medium">Z-A (Я-А)</option>
                        <option value="low">Lowest price first↓</option>
                        <option value="low2">Initially expensive↑</option>
                    </select>
                </div>
            </form>

    </header>

    <main>

        <div class="list">

                <div class="stovb"> 
                    <p>Опис Опис Опис Опис Опис Опис Опис Опис</p>

        </div>

    </main>

    <footer>

        <div class="ostrov"> <img id="open" src="./media/plus.svg"/></div>

    </footer>

    <div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
        
        <div class="flex justify-between items-center mb-5 border-b border-gray-700 pb-3">
            <h3 id="modalTitle" class="text-xl font-bold text-white">Create a record</h3>
            <button id="closeModalBtn" class="text-gray-400 hover:text-white text-2xl font-bold leading-none">&times;</button>
        </div>

        <form id="addForm" onsubmit="event.preventDefault();">

            <div class="mb-4">

            <div id="dropZone" class="border-2 border-dashed border-gray-600 rounded-xl p-4 text-center cursor-pointer hover:border-indigo-500 transition">
                <input type="file" id="fileInput" accept="image/*" class="hidden">
                <div id="uploadPlaceholder" class="py-2">
                <span class="text-sm text-gray-400">Add photo</span>
                </div>
                <img id="existingPhotoPreview" class="hidden max-h-40 mx-auto rounded-lg" src="" alt="Current photo">
                <div id="cropperContainer" class="hidden">
                <div class="max-h-60 overflow-hidden rounded-lg bg-black">
                    <img id="cropImage" class="max-w-full block" src="" alt="Crop target">
                </div>
                <button type="button" id="resetCropBtn" class="mt-2 text-xs text-red-400 hover:text-red-300 underline">Undo</button>
                </div>
            </div>
            </div>

            <div class="mb-4">
            <div class="flex justify-between items-center mb-1">
                <label for="titleInput" class="text-sm font-medium text-gray-300">Brief description</label>
                <span id="charCounter" class="text-xs text-gray-400">0 / 50</span>
            </div>
            <input type="text" id="titleInput" maxlength="50" placeholder="Text" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="mb-6">
            <label for="numberInput" class="block text-sm font-medium text-gray-300 mb-1">Price</label>
            <input type="number" id="numberInput" placeholder="0"class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="mb-4">
            <label for="linkInput" class="block text-sm font-medium text-gray-300 mb-1">Link</label>
            <input type="url" id="linkInput" placeholder="https://" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition">
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition">Add</button>

        </form>

        </div>
    </div>


</body>
